name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 핵심 로직은 표준 라이브러리만 쓰므로 설치 단계가 없다(약 15초).
      # 브랜치마다 폴더 구성이 달라서, 있는 폴더만 검사한다.
      - name: 구문 검사
        run: |
          for dir in app scripts tests; do
            if [ -d "$dir" ]; then python -m compileall -q "$dir"; fi
          done

      - name: 단위 테스트
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "tests 폴더가 없어 건너뜁니다."
          fi

  smoke:
    name: 앱 기동 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 서버를 띄우지 않고 import만 한다. 의존성 누락과 모듈 수준 오류를 잡는다.
      - name: import 확인
        run: python -c "import app.main; print(app.main.app.title)"
